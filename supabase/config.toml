project_id = "pzjhvvslhawszjrtxhih"

# og-producto la lee el robot de WhatsApp, que no tiene ninguna clave.
# Con verify_jwt (el valor por defecto) devuelve 401 y los links compartidos
# se pegan pelados, sin foto ni precio. Ahí es donde vive la distribución de
# este producto, así que tiene que ser pública.
[functions.og-producto]
verify_jwt = false

# firmar-subida SÍ exige sesión: es lo que impide que cualquiera suba
# archivos a la cuenta de Cloudinary hasta agotarla.
[functions.firmar-subida]
verify_jwt = true

# notificar la llama un trigger de la base, que manda su secreto compartido en
# la cabecera x-secreto y no un JWT. Con verify_jwt, la puerta de Supabase la
# rechaza antes de llegar al codigo y no llega ningun aviso. La funcion hace su
# propia comprobacion: sin el secreto correcto, 401.
[functions.notificar]
verify_jwt = false
